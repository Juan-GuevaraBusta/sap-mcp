[project]
name = "sap-mcp"
version = "0.1.0"
description = "MCP server that discovers SAP installations, learns from evidence, and executes authorized operations"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "websockets",
    "pycryptodome",
    "pillow",
    "pydantic",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_mcp"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["experiments", "docs", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]